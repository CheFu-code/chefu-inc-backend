app = "chefu-nook-matrix"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8008
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "matrix_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
  memory_mb = 2048

[env]
  SYNAPSE_SERVER_NAME = "matrix.chefu.co.za"
  SYNAPSE_REPORT_STATS = "no"
