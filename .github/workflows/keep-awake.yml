name: Keep Render API Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ vars.RENDER_KEEP_ALIVE_URL || 'https://api.chefuinc.com/health' }}
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "$TARGET_URL"
