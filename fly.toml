
app = "chefu-inc-backend"
primary_region = "jnb"

[env]
  GOOGLE_PLAY_PACKAGE_NAME = "za.co.chefu.cloudence"

[deploy]
  release_command = "npm run release:prod"
  release_command_timeout = "30m0s"

[http_service]
  internal_port = 4000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 2
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
