app = "chefu-inc-backend"
primary_region = "iad"

[deploy]
release_command = "npm run release:prod"
release_command_timeout = "30m"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 4_000
min_machines_running = 0
processes = [ "app" ]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
memory_mb = 1_024
