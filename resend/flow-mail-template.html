<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{SUBJECT}}</title>
  </head>
  <body style="margin:0;padding:0;background:#eef7f5;color:#10201f;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;">{{PREHEADER}}</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef7f5;padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:680px;background:#ffffff;border:1px solid #cfe8e3;border-radius:18px;overflow:hidden;box-shadow:0 14px 36px rgba(15,118,110,0.12);">
            <tr>
              <td style="padding:30px 32px 24px;background:#063f3b;color:#ffffff;">
                <div style="display:inline-block;border:1px solid rgba(255,255,255,0.22);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#bff7ee;">{{BRAND_NAME}}</div>
                <h1 style="margin:18px 0 0;font-size:28px;line-height:1.22;color:#ffffff;font-weight:800;">{{SUBJECT}}</h1>
                <p style="margin:12px 0 0;color:#d9fffa;font-size:14px;line-height:1.55;">For {{RECIPIENT_NAME}} from {{SENDER_NAME}}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;color:#263f3d;font-size:15px;line-height:1.75;">
                <div style="margin:0 0 22px;padding:12px 14px;border-left:4px solid #14b8a6;background:#f0fdfa;border-radius:0 10px 10px 0;color:#0f766e;font-size:13px;font-weight:700;">{{AUDIENCE_NAME}}</div>
                <div style="font-size:15px;line-height:1.78;color:#263f3d;">{{{BODY_HTML_1}}}{{{BODY_HTML_2}}}{{{BODY_HTML_3}}}{{{BODY_HTML_4}}}{{{BODY_HTML_5}}}</div>
                <div style="margin-top:26px;">{{{CTA_HTML}}}</div>
              </td>
            </tr>
            <tr>
              <td style="background:#f7fbfa;border-top:1px solid #dcefeb;padding:20px 32px;color:#55716e;font-size:12px;line-height:1.6;">
                Sent with Flow by CheFu Inc. Reply to this email to continue the conversation.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
