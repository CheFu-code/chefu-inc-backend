version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: chefu-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devredis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-devredis} --appendonly yes --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-devredis}","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

volumes:
  redis_data:
