version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: logix-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-logixkurisani}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-logixkurisani} --appendonly yes --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-logixkurisani}","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

volumes:
  redis_data:
